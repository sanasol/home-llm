global:
  scrape_interval: 15s
  scrape_timeout: 12s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: node
    static_configs: [{targets: ["localhost:9100"]}]

  - job_name: gpu
    static_configs: [{targets: ["localhost:9800"]}]

  - job_name: vllm
    metrics_path: /metrics
    bearer_token_file: /etc/prometheus/tokens/side.key
    # A back on vLLM 0.32 since 29.10 13:38 EDT (OpenJet trial rolled back, docs/16).
    static_configs:
      - targets: ["localhost:18020"]
        labels: {engine: "qwen27b-a"}
      - targets: ["localhost:18021"]
        labels: {engine: "qwen27b-b"}

  - job_name: strata
    metrics_path: /metrics
    bearer_token_file: /etc/prometheus/tokens/strata.key
    params: {requests: ["all"]}
    static_configs: [{targets: ["localhost:8001"]}]

  - job_name: hub
    static_configs: [{targets: ["<wg-peer>:9100"]}]

  - job_name: litellm
    static_configs: [{targets: ["localhost:9093"]}]

  # rig_llm_exporter (rig/scripts/rig_llm_exporter.py): uniform tok/s, KV, cache counters
  # for ALL engines (Strata JSON, vLLM A/B /metrics) + GPU/fan name joins.
  - job_name: rig_llm
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs: [{targets: ["localhost:9097"]}]
