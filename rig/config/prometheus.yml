global:
  scrape_interval: 15s
  scrape_timeout: 12s

scrape_configs:
  - job_name: node
    static_configs: [{targets: ["localhost:9100"]}]

  - job_name: gpu
    static_configs: [{targets: ["localhost:9800"]}]

  - job_name: vllm
    metrics_path: /metrics
    bearer_token_file: /etc/prometheus/tokens/side.key
    static_configs:
      - targets: ["localhost:18020"]
        labels: {engine: "qwen27b-a"}
      - targets: ["localhost:18021"]
        labels: {engine: "qwen27b-b"}

  - job_name: strata
    metrics_path: /metrics
    bearer_token_file: /etc/prometheus/tokens/strata.key
    params: {requests: ["all"]}
    static_configs: [{targets: ["localhost:8001"]}]

  - job_name: hub
    static_configs: [{targets: ["<wg-peer>:9100"]}]

  - job_name: litellm
    static_configs: [{targets: ["localhost:9093"]}]