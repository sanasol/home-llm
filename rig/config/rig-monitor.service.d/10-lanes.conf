# /etc/systemd/system/rig-monitor.service.d/10-lanes.conf
# Three Strata lanes of Qwen3.8-Flash-Next (docs/23): main :8001 (5090, llm-main),
# lane2 :8003 (3090 idx 1, llm-lane2), lane3 :8004 (3090 idx 2, llm-lane3).
# All lanes share one API key; the monitor reads it from the main preset JSON (api_key),
# never from the environment (the agent redactor mangles literal secrets).
# History persists to /opt/rig/monitor/data/hist.db (dir owned by al).
[Service]
Environment=STRATA_URL=http://127.0.0.1:8001
Environment=L2_URL=http://127.0.0.1:8003
Environment=L3_URL=http://127.0.0.1:8004
Environment=MAIN_UNIT=llm-main
Environment=L2_UNIT=llm-lane2
Environment=L3_UNIT=llm-lane3
Environment=STRATA_KEY=~/.config/strata/launch-presets/main.json
Environment=HIST_DB=/opt/rig/monitor/data/hist.db
