# /etc/systemd/system/rig-monitor.service.d/10-hyperqwen.conf
# Both HyperQwen slots are scraped now (A :18020 speed, B :18021 262K). Key lives in
# /opt/rig/side.env (env-style file, owner al, built from ~/HyperQwen/api_key.txt
# by rig/scripts/mk_side_env.py — do NOT rebuild it with inline `$(cat ...)` shell:
# the agent output-redactor replaces credential-ish substitutions silently).
# History persists to /opt/rig/monitor/data/hist.db (dir owned by al).
[Service]
Environment=VLLM_ENV=/opt/rig/side.env
Environment=A_URL=http://127.0.0.1:18020
Environment=B_URL=http://127.0.0.1:18021
Environment=A_UNIT=hyperqwen-a
Environment=B_UNIT=hyperqwen-b
Environment=HIST_DB=/opt/rig/monitor/data/hist.db
