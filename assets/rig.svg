<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<rect width="100%" height="100%" fill="#0b0f17"/>
<text x="40" y="50" fill="#e7edf7" font-size="28" font-weight="700">The rig, in one picture</text>
<text x="40" y="76" fill="#8b98ad" font-size="14">One 5090 and one 3090 inside the case; the other 3090 sits outside on OCuLink x4, with its own PSU. Arena and LiteLLM ride below.</text>
<rect x="50" y="104" width="440" height="500" rx="18" fill="#151b26" stroke="#2a3342"/><text x="80" y="136" fill="#8b98ad" font-size="12">CORSAIR case · glass on the left · internal PSU</text><rect x="80" y="152" width="380" height="82" rx="12" fill="#1d2a44" stroke="#5b8cff"/><text x="100" y="178" fill="#e7edf7" font-size="15" font-weight="700">RTX 5090 · 32 GB</text><text x="100" y="198" fill="#8b98ad" font-size="12">PCIe 5.0 x8 · 28.9 GB/s · 2 slots · 512K YaRNx2</text><text x="100" y="218" fill="#5b8cff" font-size="12">llm-main :8001 · 160-205 t/s solo</text><rect x="80" y="246" width="380" height="82" rx="12" fill="#2a2418" stroke="#f4a261"/><text x="100" y="272" fill="#e7edf7" font-size="15" font-weight="700">RTX 3090 #2 · 24 GB</text><text x="100" y="292" fill="#8b98ad" font-size="12">PCIe 4.0 x8 · 13.4 GB/s · the inside card</text><text x="100" y="312" fill="#f4a261" font-size="12">llm-lane3 :8004 · 256K · 1 slot · 113-127 t/s</text><rect x="80" y="346" width="170" height="86" rx="10" fill="#151b26" stroke="#2a3342"/><text x="94" y="370" fill="#e7edf7" font-size="12" font-weight="700">Ryzen 9 9950X</text><text x="94" y="386" fill="#8b98ad" font-size="10">16C / 32T · AVX-512 VNNI</text><text x="270" y="370" fill="#e7edf7" font-size="12" font-weight="700">96 GB DDR5-6000</text><rect x="270" y="386" width="32" height="56" rx="5" fill="#232c3b" stroke="#2a3342"/><rect x="314" y="386" width="32" height="56" rx="5" fill="#232c3b" stroke="#2a3342"/><rect x="358" y="386" width="32" height="56" rx="5" fill="#232c3b" stroke="#2a3342"/><rect x="402" y="386" width="32" height="56" rx="5" fill="#232c3b" stroke="#2a3342"/><text x="270" y="458" fill="#8b98ad" font-size="10">2 channels</text><rect x="80" y="470" width="180" height="54" rx="10" fill="#151b26" stroke="#2a3342"/><text x="94" y="490" fill="#e7edf7" font-size="11" font-weight="700">Samsung 990 PRO 2 TB</text><text x="94" y="506" fill="#8b98ad" font-size="10">models, slots, conversation files</text><rect x="275" y="470" width="185" height="54" rx="10" fill="#151b26" stroke="#2a3342"/><text x="289" y="490" fill="#e7edf7" font-size="11" font-weight="700">internal PSU</text><text x="289" y="506" fill="#8b98ad" font-size="10">powers 5090 + inside 3090</text><text x="80" y="560" fill="#8b98ad" font-size="10">fan floor 41% -> 0% idle via driver runtime override (Ampere Cert 3.0)</text><rect x="650" y="150" width="270" height="92" rx="12" fill="#2a2418" stroke="#f4a261"/><text x="668" y="176" fill="#e7edf7" font-size="14" font-weight="700">RTX 3090 #1 · 24 GB</text><text x="668" y="196" fill="#8b98ad" font-size="11">PCIe 4.0 x4 · OCuLink · 6.7 GB/s measured</text><text x="668" y="214" fill="#f4a261" font-size="11">llm-lane2 :8003 · 256K · 1 slot · 110-120 t/s</text><rect x="650" y="262" width="270" height="82" rx="12" fill="#12281f" stroke="#46d7a2"/><text x="668" y="288" fill="#e7edf7" font-size="13" font-weight="700">Minisforum DEG1 dock + 850 W PSU</text><text x="668" y="306" fill="#8b98ad" font-size="11">the outside card lands here; its own power</text><text x="668" y="324" fill="#46d7a2" font-size="11">OCuLink x4: thin cable, 6.7 GB/s measured</text><path d="M530 192 C590 192 610 190 650 190" stroke="#f4a261" stroke-width="3" fill="none"/><text x="545" y="180" fill="#8b98ad" font-size="10">x4 OCuLink</text><rect x="650" y="372" width="480" height="62" rx="12" fill="#12281f" stroke="#46d7a2"/><text x="668" y="396" fill="#e7edf7" font-size="13" font-weight="700">50 GB shared expert arena · tmpfs in RAM</text><text x="668" y="416" fill="#8b98ad" font-size="11">one copy read by all three engines; /dev/shm quota kills it silently at 36 GiB</text><rect x="650" y="452" width="480" height="62" rx="12" fill="#211a2e" stroke="#a78bfa"/><text x="668" y="476" fill="#e7edf7" font-size="13" font-weight="700">LiteLLM :8010 · one door, four streams</text><text x="668" y="496" fill="#8b98ad" font-size="11">sticky sessions by pin-count; FN names fall back to DS when the rig is in DS mode</text><text x="40" y="620" fill="#8b98ad" font-size="11">links: 5090 28.9 GB/s · inside 3090 x8 13.4 · outside 3090 x4 6.7 — the x4 card gets fewer layers in DS mode</text></svg>