<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<rect width="100%" height="100%" fill="#0b0f17"/>
<text x="40" y="50" fill="#e7edf7" font-size="28" font-weight="700">The rig, in one picture</text>
<text x="40" y="76" fill="#8b98ad" font-size="14">Corsair case + one RTX 5090 inside; two RTX 3090s on the right (one on OCuLink x4). Shared expert arena and LiteLLM ride below.</text>
<rect x="50" y="108" width="470" height="470" rx="18" fill="#151b26" stroke="#2a3342"/><text x="80" y="140" fill="#8b98ad" font-size="12">CORSAIR case · glass on the left</text><rect x="80" y="160" width="410" height="86" rx="12" fill="#1d2a44" stroke="#5b8cff"/><text x="100" y="188" fill="#e7edf7" font-size="15" font-weight="700">RTX 5090 · 32 GB</text><text x="100" y="208" fill="#8b98ad" font-size="12">PCIe 5.0 x8 · 28.9 GB/s link · 2 slots · 512K YaRNx2</text><text x="100" y="226" fill="#5b8cff" font-size="12">llm-main :8001 · 160-205 t/s solo</text><rect x="80" y="266" width="170" height="96" rx="12" fill="#151b26" stroke="#2a3342"/><text x="96" y="292" fill="#e7edf7" font-size="13" font-weight="700">Ryzen 9 9950X</text><text x="96" y="310" fill="#8b98ad" font-size="11">16C / 32T</text><text x="96" y="328" fill="#8b98ad" font-size="11">AVX-512 VNNI</text><text x="270" y="292" fill="#e7edf7" font-size="13" font-weight="700">96 GB DDR5-6000</text><text x="270" y="310" fill="#8b98ad" font-size="11">2 channels · the wall for CPU expert pools</text><rect x="270" y="330" width="34" height="70" rx="5" fill="#232c3b" stroke="#2a3342"/><rect x="316" y="330" width="34" height="70" rx="5" fill="#232c3b" stroke="#2a3342"/><rect x="362" y="330" width="34" height="70" rx="5" fill="#232c3b" stroke="#2a3342"/><rect x="408" y="330" width="34" height="70" rx="5" fill="#232c3b" stroke="#2a3342"/><rect x="80" y="388" width="210" height="58" rx="12" fill="#151b26" stroke="#2a3342"/><text x="96" y="410" fill="#e7edf7" font-size="12" font-weight="700">Samsung 990 PRO 2 TB</text><text x="96" y="428" fill="#8b98ad" font-size="11">models, slots, conversation files</text><rect x="300" y="388" width="190" height="58" rx="12" fill="#151b26" stroke="#2a3342"/><text x="316" y="410" fill="#e7edf7" font-size="12" font-weight="700">850 W PSU</text><text x="316" y="428" fill="#8b98ad" font-size="11">the DEG1 dock has its own</text><text x="80" y="500" fill="#8b98ad" font-size="11">fan floor 41% -> 0% idle via driver runtime override (Ampere Cert 3.0)</text><rect x="650" y="150" width="220" height="94" rx="12" fill="#2a2418" stroke="#f4a261"/><text x="666" y="176" fill="#e7edf7" font-size="14" font-weight="700">RTX 3090 #1 · 24 GB</text><text x="666" y="196" fill="#8b98ad" font-size="11">PCIe 4.0 x4 · OCuLink · 6.7 GB/s measured</text><text x="666" y="214" fill="#f4a261" font-size="11">llm-lane2 :8003 · 256K · 1 slot · 110-120 t/s</text><rect x="650" y="260" width="220" height="94" rx="12" fill="#2a2418" stroke="#f4a261"/><text x="666" y="286" fill="#e7edf7" font-size="14" font-weight="700">RTX 3090 #2 · 24 GB</text><text x="666" y="306" fill="#8b98ad" font-size="11">PCIe 4.0 x8 · 13.4 GB/s measured</text><text x="666" y="324" fill="#f4a261" font-size="11">llm-lane3 :8004 · 256K · 1 slot · 113-127 t/s</text><path d="M520 200 C580 200 600 197 650 197" stroke="#f4a261" stroke-width="3" fill="none"/><path d="M520 290 C580 290 600 307 650 307" stroke="#f4a261" stroke-width="3" fill="none"/><text x="540" y="188" fill="#8b98ad" font-size="10">x4 OCuLink</text><text x="540" y="300" fill="#8b98ad" font-size="10">x8 riser</text><rect x="650" y="392" width="480" height="62" rx="12" fill="#12281f" stroke="#46d7a2"/><text x="668" y="416" fill="#e7edf7" font-size="13" font-weight="700">50 GB shared expert arena · tmpfs in RAM</text><text x="668" y="436" fill="#8b98ad" font-size="11">one copy read by all three engines; /dev/shm quota kills it silently at 36 GiB</text><rect x="650" y="472" width="480" height="62" rx="12" fill="#211a2e" stroke="#a78bfa"/><text x="668" y="496" fill="#e7edf7" font-size="13" font-weight="700">LiteLLM :8010 · one door, four streams</text><text x="668" y="516" fill="#8b98ad" font-size="11">sticky sessions by pin-count; FN names fall back to DS when the rig is in DS mode</text><text x="40" y="600" fill="#8b98ad" font-size="11">measured links: 5090 28.9 GB/s · 3090 x8 13.4 · 3090 x4 6.7 — the x4 card gets fewer layers in DS mode</text></svg>