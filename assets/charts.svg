<text x="40" y="54" fill="#e7edf7" font-size="28" font-weight="700">Numbers that actually mattered</text>
<text x="40" y="82" fill="#8b98ad" font-size="14">measured on my boxes · not vendor slides · every number is re-runnable from this repo</text>
<rect x="40" y="110" width="520" height="270" rx="18" fill="#151b26" stroke="#2a3342"/><rect x="620" y="110" width="540" height="270" rx="18" fill="#151b26" stroke="#2a3342"/><rect x="40" y="420" width="520" height="300" rx="18" fill="#151b26" stroke="#2a3342"/><rect x="620" y="420" width="540" height="300" rx="18" fill="#151b26" stroke="#2a3342"/><text x="60" y="146" fill="#e7edf7" font-size="16" font-weight="600">Mac · same 20K-token agent chat</text><text x="60" y="168" fill="#8b98ad" font-size="12">decode t/s, 5 engines, one long conversation</text><text x="60" y="219" fill="#8b98ad" font-size="12">Splash + DFlash2</text><rect x="230" y="205" width="192.05" height="18" rx="9" fill="#5b8cff"/><text x="428.05" y="219" fill="#e7edf7" font-size="12" font-weight="600">33.4 t/s</text><text x="60" y="261" fill="#8b98ad" font-size="12">TensorFold 0.6.6</text><rect x="230" y="247" width="153.525" height="18" rx="9" fill="#a78bfa"/><text x="389.525" y="261" fill="#e7edf7" font-size="12" font-weight="600">26.7 t/s</text><text x="60" y="303" fill="#8b98ad" font-size="12">oMLX + DFlash2</text><rect x="230" y="289" width="139.725" height="18" rx="9" fill="#f2789f"/><text x="375.725" y="303" fill="#e7edf7" font-size="12" font-weight="600">24.3 t/s</text><text x="60" y="345" fill="#8b98ad" font-size="12">llama.cpp MTP</text><rect x="230" y="331" width="73.025" height="18" rx="9" fill="#8b98ad"/><text x="309.025" y="345" fill="#e7edf7" font-size="12" font-weight="600">12.7 t/s</text><text x="60" y="365" fill="#8b98ad" font-size="11">lesson: prefill, not decode, decides agent latency</text><text x="640" y="146" fill="#e7edf7" font-size="16" font-weight="600">Rig · decode per lane</text><text x="640" y="168" fill="#8b98ad" font-size="12">t/s; FN lanes run 2+1+1 streams, DS runs whole box</text><text x="640" y="219" fill="#8b98ad" font-size="12">FN 5090 · 2 slots</text><rect x="760" y="205" width="242.54545454545453" height="18" rx="9" fill="#5b8cff"/><text x="1008.5454545454545" y="219" fill="#e7edf7" font-size="12" font-weight="600">184 t/s</text><text x="640" y="261" fill="#8b98ad" font-size="12">FN 3090 #1</text><rect x="760" y="247" width="151.5909090909091" height="18" rx="9" fill="#f4a261"/><text x="917.5909090909091" y="261" fill="#e7edf7" font-size="12" font-weight="600">115 t/s</text><text x="640" y="303" fill="#8b98ad" font-size="12">FN 3090 #2 · x4</text><rect x="760" y="289" width="158.1818181818182" height="18" rx="9" fill="#f4a261"/><text x="924.1818181818182" y="303" fill="#e7edf7" font-size="12" font-weight="600">120 t/s</text><text x="640" y="345" fill="#8b98ad" font-size="12">DS Maya</text><rect x="760" y="331" width="89.63636363636364" height="18" rx="9" fill="#46d7a2"/><text x="855.6363636363636" y="345" fill="#e7edf7" font-size="12" font-weight="600">68 t/s</text><text x="640" y="365" fill="#8b98ad" font-size="11">FN aggregate for all four streams: 371–392 t/s</text><text x="60" y="456" fill="#e7edf7" font-size="16" font-weight="600">Conversation parking · cold vs restored</text><text x="60" y="478" fill="#8b98ad" font-size="12">seconds; RAM + disk keep a conversation near-instant</text><text x="60" y="524" fill="#8b98ad" font-size="12">442K-token thread</text><rect x="260" y="510" width="305.25" height="18" rx="9" fill="#3b4352"/><text x="575.25" y="524" fill="#e7edf7" font-size="12">74s cold</text><rect x="260" y="536" width="19.8" height="18" rx="9" fill="#46d7a2"/><text x="289.8" y="550" fill="#46d7a2" font-size="12" font-weight="700">4.8s back</text><text x="60" y="614" fill="#8b98ad" font-size="12">102K-token thread</text><rect x="260" y="600" width="61.875" height="18" rx="9" fill="#3b4352"/><text x="331.875" y="614" fill="#e7edf7" font-size="12">15s cold</text><rect x="260" y="626" width="3.7125" height="18" rx="9" fill="#46d7a2"/><text x="273.7125" y="640" fill="#46d7a2" font-size="12" font-weight="700">0.9s back</text><text x="60" y="690" fill="#8b98ad" font-size="11">both tiers live together: RAM 2 GiB + disk 32 GiB on the 5090</text><text x="640" y="456" fill="#e7edf7" font-size="16" font-weight="600">Russian output, before/after sampling</text><text x="640" y="478" fill="#8b98ad" font-size="12">share of long answers with a glitch (Chinese char, Latin look-alike, half-English)</text><text x="640" y="534" fill="#8b98ad" font-size="12">before</text><rect x="800" y="520" width="274.5" height="18" rx="9" fill="#3b4352"/><text x="1084.5" y="534" fill="#e7edf7" font-size="12" font-weight="600">18.3%</text><text x="640" y="574" fill="#8b98ad" font-size="12">after</text><rect x="800" y="560" width="25.5" height="18" rx="9" fill="#46d7a2"/><text x="835.5" y="574" fill="#e7edf7" font-size="12" font-weight="600">1.7%</text><text x="640" y="620" fill="#8b98ad" font-size="11">fix = temperature 0.7 + min_p 0.05, not a new model</text><text x="640" y="680" fill="#8b98ad" font-size="11">scanner + A/B harness in rig/scripts</text></svg>